dbt_bcb:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('PGHOST', 'localhost') }}"
      port: "{{ env_var('PGPORT', '5433') | int }}"
      user: "{{ env_var('PGUSER', 'bcb') }}"
      password: "{{ env_var('PGPASSWORD', 'bcb') }}"
      dbname: "{{ env_var('PGDATABASE', 'bcb') }}"
      schema: public
      threads: 4
